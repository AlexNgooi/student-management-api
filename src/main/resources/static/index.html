<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>

    <div class="grid">
        <div class="card">
            <h2 id="form-title">Add Student</h2>

            <form id="student-form">
                <input type="hidden" id="student-id" />

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required />
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="1" required />
                </div>

                <div class="form-group">
                    <label for="major">Major</label>
                    <input type="text" id="major" required />
                </div>

                <div class="form-group">
                    <label for="cgpa">CGPA</label>
                    <input type="number" id="cgpa" min="0" max="4" step="0.01" required />
                </div>

                <div class="button-row">
                    <button type="submit" class="btn-primary" id="submit-btn">Add Student</button>
                    <button type="button" class="btn-secondary" id="reset-btn">Reset</button>
                </div>
            </form>

            <div id="status" class="status"></div>
        </div>

        <div class="card">
            <div class="list-header">
                <h2>Student List</h2>
                <button class="btn-secondary" id="refresh-btn">Refresh</button>
            </div>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Major</th>
                    <th>CGPA</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="student-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
